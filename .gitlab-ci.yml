variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
stages:
  - build
  - test
  - lint
build:
  stage: build
  script:
    - mvn clean install
test:
  stage: test
  script:
    - mvn test
lint:
  stage: lint
  image: jetbrains/qodana-cli
  script:
    - qodana analyze --project .
  artifacts:
    paths:
      - .qodana/report.html
sonarcloud-check:
  image: maven:3.6.3-jdk-11
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - mvn verify sonar:sonar -Dsonar.projectKey=prx-open_persistence -s ci_settings.xml
  only:
    - merge_requests
    - master
    - develop
