name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # shallow clones disable relevant SonarCloud analysis features

      - name: Analyze with SonarCloud
        # The legacy sonarcloud-github-action bundles a Java 11 scanner that cannot load
        # the scanner engine served by SonarCloud (class file version 61 / Java 17).
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=com.prx:persistence
            -Dsonar.organization=prx-open
